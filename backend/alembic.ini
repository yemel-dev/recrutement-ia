[alembic]
script_location = alembic
prepend_sys_path = .

# L'URL de la base est définie dynamiquement dans alembic/env.py à partir
# de app.config.settings (ton .env) — ne pas la mettre ici en dur, pour ne
# jamais avoir deux sources de vérité différentes pour la même info.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S