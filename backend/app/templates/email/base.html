<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>{% block titre %}Recrutement IA{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:560px; background-color:#ffffff; border-radius:8px; overflow:hidden;" cellpadding="0" cellspacing="0">
          <tr>
            <td style="background-color:#1f2937; padding:20px 32px;">
              <span style="color:#ffffff; font-size:18px; font-weight:bold;">Recrutement IA</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {% block contenu %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px; background-color:#f9fafb; color:#9ca3af; font-size:12px;">
              Cet email a été envoyé automatiquement par Recrutement IA. Merci de ne pas y répondre.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
